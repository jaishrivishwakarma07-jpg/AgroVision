
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Form | AGROVISION</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f7f0; padding: 24px; color: #243426; }
        .container { max-width: 680px; margin: auto; }
        .panel { background: white; padding: 24px; border-radius: 12px; }
        h1 { color: #276738; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select { box-sizing: border-box; width: 100%; padding: 11px; margin-top: 6px; border: 1px solid #cbd5c5; border-radius: 6px; }
        .btn { display: inline-block; margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 6px; background: #276738; color: white; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<main class="container">
    <section class="panel">
        <h1>🌱 AGROVISION</h1>
        <h2>{{ 'Edit Crop' if crop else 'Add Crop' }}</h2>

        <form method="POST">
            <label>Farm *</label>
            <select name="farm_id" required>
                <option value="">Select Farm</option>
                {% for farm in farms %}
                    <option value="{{ farm.get('farm_id', '') }}"
                        {% if crop and crop.get('farm_id') == farm.get('farm_id') %}selected{% endif %}>
                        {{ farm.get('farm_id', '') }} - {{ farm.get('farm_name', '') }}
                    </option>
                {% endfor %}
            </select>

            <label>Crop Name *</label>
            <input name="crop_name" required value="{{ crop.get('crop_name', '') if crop else '' }}" placeholder="e.g. Wheat">

            <label>Crop Variety</label>
            <input name="crop_variety" value="{{ crop.get('crop_variety', '') if crop else '' }}" placeholder="e.g. HD-2967">

            <label>Season</label>
            <select name="season">
                {% for season in ['', 'Kharif', 'Rabi', 'Zaid', 'All Season'] %}
                    <option value="{{ season }}" {% if crop and crop.get('season') == season %}selected{% endif %}>{{ season if season else 'Select Season' }}</option>
                {% endfor %}
            </select>

            <label>Sowing Date</label>
            <input type="date" name="sowing_date" value="{{ crop.get('sowing_date', '') if crop else '' }}">

            <label>Expected Harvest Date</label>
            <input type="date" name="expected_harvest_date" value="{{ crop.get('expected_harvest_date', '') if crop else '' }}">

            <label>Crop Status</label>
            <select name="status">
                {% for status in ['Planned', 'Sown', 'Growing', 'Harvested'] %}
                    <option value="{{ status }}" {% if crop and crop.get('status') == status %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>

            <button class="btn" type="submit">Save Crop</button>
            <a class="btn" href="{{ url_for('crop_management') }}">Cancel</a>
        </form>
    </section>
</main>
</body>
</html>
