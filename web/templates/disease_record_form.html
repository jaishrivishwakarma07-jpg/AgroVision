<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | AGROVISION</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px;
            background: #f3f7f0; color: #243426;
            font-family: Arial, sans-serif;
        }
        .container { max-width: 750px; margin: auto; }
        .panel {
            background: white; padding: 24px;
            border-radius: 12px; box-shadow: 0 2px 10px #0000000d;
        }
        h1 { color: #276738; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input, select {
            width: 100%; padding: 11px; border: 1px solid #cbd5c7;
            border-radius: 6px; font-size: 15px;
        }
        .btn {
            display: inline-block; margin-top: 18px; padding: 11px 16px;
            border: 0; border-radius: 7px; background: #276738;
            color: white; text-decoration: none; cursor: pointer;
        }
        .secondary { background: #64748b; }
        .message {
            background: #edf7ed; padding: 12px;
            margin-bottom: 12px; border-radius: 7px;
        }
        .hint { color: #5c6b5d; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <section class="panel">
        <h1>🌱 AGROVISION</h1>
        <h2>{{ page_title }}</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="common_name">Plant Name</label>
            <input id="common_name" name="common_name"
                   value="{{ record.get('common_name', '') if record else '' }}"
                   placeholder="e.g. Garden Tomato">

            <label for="scientific_name">Scientific Name</label>
            <input id="scientific_name" name="scientific_name"
                   value="{{ record.get('scientific_name', '') if record else '' }}"
                   placeholder="e.g. Solanum lycopersicum">

            <label for="plant_confidence">Plant Confidence (%)</label>
            <input id="plant_confidence" name="plant_confidence"
                   type="number" min="0" max="100" step="0.1"
                   value="{% if record and record.get('plant_confidence') is not none %}{{ record.get('plant_confidence') }}{% endif %}"
                   placeholder="e.g. 92.5">

            <label for="disease">Disease / Result</label>
            <input id="disease" name="disease"
                   value="{{ record.get('disease', '') if record else '' }}"
                   placeholder="e.g. Tobacco mosaic">

            <label for="disease_confidence">Disease Confidence (%)</label>
            <input id="disease_confidence" name="disease_confidence"
                   type="number" min="0" max="100" step="0.1"
                   value="{% if record and record.get('disease_confidence') is not none %}{{ record.get('disease_confidence') }}{% endif %}"
                   placeholder="e.g. 38.8">

            <label for="disease_confirmed">Result Status</label>
            <select id="disease_confirmed" name="disease_confirmed">
                <option value="no"
                    {% if not record or not record.get('disease_confirmed') %}selected{% endif %}>
                    Not confirmed
                </option>
                <option value="yes"
                    {% if record and record.get('disease_confirmed') %}selected{% endif %}>
                    Confirmed
                </option>
            </select>
            <p class="hint">Set Confirmed only when the result has been verified.</p>

            <label for="image">Image File Name</label>
            <input id="image" name="image"
                   value="{{ record.get('image', '') if record else '' }}"
                   placeholder="Image filename or N/A">

            <button class="btn" type="submit">Save Record</button>
            <a class="btn secondary"
               href="{{ url_for('admin_module_page', module_name='diseases') }}">
                Cancel
            </a>
        </form>
    </section>
</div>
</body>
</html>
