
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Form | AGROVISION</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f7f0; padding: 24px; color: #243426; }
        .container { max-width: 650px; margin: auto; }
        .panel { background: white; padding: 24px; border-radius: 12px; }
        h1 { color: #276738; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select { box-sizing: border-box; width: 100%; padding: 11px; margin-top: 6px; border: 1px solid #cbd5c5; border-radius: 6px; }
        .btn { display: inline-block; margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 6px; background: #276738; color: white; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
<main class="container">
    <section class="panel">
        <h1>🌱 AGROVISION</h1>
        <h2>{{ 'Edit Farmer' if farmer else 'Add Farmer' }}</h2>

        <form method="POST">
            {% if farmer %}
                <label>Farmer ID</label>
                <input value="{{ farmer.get('farmer_id', '') }}" disabled>
            {% endif %}

            <label>Farmer Name *</label>
            <input name="name" required value="{{ farmer.get('name', '') if farmer else '' }}">

            <label>Age</label>
            <input name="age" type="number" min="1" value="{{ farmer.get('age', '') if farmer else '' }}">

            <label>Gender</label>
            <select name="gender">
                <option value="">Select Gender</option>
                {% for gender in ['Male', 'Female', 'Other'] %}
                    <option value="{{ gender }}" {% if farmer and farmer.get('gender') == gender %}selected{% endif %}>{{ gender }}</option>
                {% endfor %}
            </select>

            <label>Mobile</label>
            <input name="mobile" type="tel" value="{{ farmer.get('mobile', '') if farmer else '' }}">

            <label>State</label>
            <input name="state" value="{{ farmer.get('state', '') if farmer else '' }}">

            <label>District</label>
            <input name="district" value="{{ farmer.get('district', '') if farmer else '' }}">

            <label>Village</label>
            <input name="village" value="{{ farmer.get('village', '') if farmer else '' }}">

            <label>Land (acres or your chosen unit)</label>
            <input name="land" type="number" min="0" step="any" value="{{ farmer.get('land', '') if farmer else '' }}">

            <button class="btn" type="submit">Save Farmer</button>
            <a class="btn" href="{{ url_for('farmer_management') }}">Cancel</a>
        </form>
    </section>
</main>
</body>
</html>
